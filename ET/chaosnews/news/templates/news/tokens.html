<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra de Tokens - Kaos News</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            color: #4a90e2;
            font-weight: 700;
        }
        .token-option {
            margin-bottom: 20px;
        }
        .token-option label {
            display: block;
            margin-bottom: 5px;
            color: #b0c4de;
        }
        .token-option select, .token-option input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #4a90e2;
            border-radius: 4px;
            background-color: #2a2a2a;
            color: #ffffff;
        }
        .purchase-button, .home-button {
            background-color: #4a90e2;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: 700;
            transition: background-color 0.3s ease;
        }
        .purchase-button:hover, .home-button:hover {
            background-color: #357ab8;
        }
        .home-button {
            background-color: #333333;
        }
        .home-button:hover {
            background-color: #555555;
        }
        .description {
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #b0c4de;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Compra de Tokens</h1>
        <p class="description">Adquiere tokens para acceder a contenido exclusivo y servicios adicionales en Kaos News.</p>
        <form>
            <div class="token-option">
                <label for="token-amount">Cantidad de Tokens</label>
                <select id="token-amount" name="token-amount">
                    <option value="100">100 Tokens - CLP 10,000</option>
                    <option value="200">200 Tokens - CLP 18,000</option>
                    <option value="500">500 Tokens - CLP 40,000</option>
                </select>
            </div>
            <div class="token-option">
                <label for="payment-method">Método de Pago</label>
                <select id="payment-method" name="payment-method">
                    <option value="credit-card">Tarjeta de Crédito / Debito</option>
                    <option value="paypal">PayPal</option>
                    <option value="bank-transfer">Transferencia Bancaria</option>
                </select>
            </div>
            <div class="token-option">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit" class="purchase-button">Comprar Tokens</button>
        </form>
        <button onclick="window.location.href='index.html';" class="home-button">Volver al Inicio</button>
    </div>
</body>
</html>
