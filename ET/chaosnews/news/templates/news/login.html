{% extends "news/core.html" %} 
{% block title %}Login{% endblock %} 
{% block head_override%}
<style>
  body {
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .login-form {
    background-color: #ffffff;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    padding: 30px;
    width: 100%;
    max-width: 400px;
    margin: 20vh auto;
    flex: 1;
  }
  .form-group {
    margin-bottom: 15px;
  }
  .form-control {
    border-radius: 5px;
  }
  .btn-login {
    background-color: #007bff;
    border: none;
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  .btn-login:hover {
    background-color: #0056b3;
  }
  .form-header {
    margin-bottom: 20px;
    text-align: center;
  }
  #form-container {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  #messages{
    color: #000000;
  }
</style>
{% endblock %} 
{% block content %}
<div class="container" id="form-container">
  <div class="login-form container">
    <h2 class="form-header">Login</h2>
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label for="email">Nombre de Usuario</label>
        <input
          type="text"
          class="form-control"
          id="username"
          name="username"
          placeholder="Ingrese nombre de usuario"
        />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          placeholder="Password"
        />
      </div>
      <div>
        {% for message in messages %}
        <p id="messages">{{message}}</p>
        {% endfor%}
      </div>
      <button type="submit" class="btn btn-login btn-block">Login</button>
    </form>
  </div>
</div>
{% endblock %}
