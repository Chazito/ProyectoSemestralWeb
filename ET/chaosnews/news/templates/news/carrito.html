{% extends "news/core.html" %}
{% load static %}

{% block title %}Carrito{% endblock %}

{% block head_override%}
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #1f1f1f;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #4a90e2;
            text-align: center;
        }
        .item {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #4a90e2;
            border-radius: 4px;
            background-color: #2a2a2a;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-title {
            font-size: 1.2em;
            font-weight: bold;
        }
        .item-price {
            font-size: 1.1em;
            color: #b0c4de;
        }
        .actions {
            text-align: right;
            margin-top: 10px;
        }
        .btn {
            padding: 8px 16px;
            font-size: 0.9em;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-decoration: none;
            margin-right: 10px;
        }
        .btn:hover {
            background-color: #357ab8;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
        }
        .footer a {
            color: #b0c4de;
            text-decoration: none;
            margin-right: 10px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="container">
        <h1>Carrito de Compras - Chaos News</h1>
        
        <div class="item">
            <div class="item-header">
                <div class="item-title">Membresías</div>
            </div>
            <div class="actions">
                <a href="{% url 'comprar_membresia' %}" class="btn">Comprar Membresía</a>
            </div>
        </div>
        
        <div class="item">
            <div class="item-header">
                <div class="item-title">Tokens Pack </div>
            </div>
            <div class="actions">
                <a href="{% url 'comprar_tokens' %}" class="btn">Comprar Tokens</a>
            </div>
        </div>

        <div class="footer">
            <a href="{% url 'index' %}" class="btn">Volver al Inicio</a>
        </div>
    </div>
{% endblock%}
