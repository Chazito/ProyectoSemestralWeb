<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra de Membresía - Kaos News</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            color: #4a90e2;
        }
        .membership-option {
            margin-bottom: 20px;
        }
        .membership-option label {
            display: block;
            margin-bottom: 5px;
            color: #b0c4de;
        }
        .membership-option select, .membership-option input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #4a90e2;
            border-radius: 4px;
            background-color: #2a2a2a;
            color: #ffffff;
        }
        .purchase-button, .home-button {
            background-color: #4a90e2;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .purchase-button:hover, .home-button:hover {
            background-color: #357ab8;
        }
        .home-button {
            background-color: #333333;
        }
        .home-button:hover {
            background-color: #555555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Compra de Membresía</h1>
        <form>
            <div class="membership-option">
                <label for="membership-type">Tipo de Membresía</label>
                <select id="membership-type" name="membership-type">
                    <option value="basic">Básica - CLP 24,000 / año</option>
                    <option value="premium">Premium - CLP 40,000 / año</option>
                    <option value="vip">VIP - CLP 80,000 / año</option>
                </select>
            </div>
            <div class="membership-option">
                <label for="payment-method">Método de Pago</label>
                <select id="payment-method" name="payment-method">
                    <option value="credit-card">Tarjeta de Crédito / Debito</option>
                    <option value="paypal">PayPal</option>
                    <option value="bank-transfer">Transferencia Bancaria</option>
                </select>
            </div>
            <div class="membership-option">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit" class="purchase-button">Comprar Membresía</button>
        </form>
        <button onclick="window.location.href='index.html';" class="home-button">Volver al Inicio</button>
    </div>
</body>
</html>
